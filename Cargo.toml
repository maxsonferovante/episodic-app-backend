[workspace]
members = [
    "crates/shared",
    "crates/google-auth-lambda",
    "crates/authorizer-lambda",
    "crates/catalog-lambda",
    "crates/library-lambda",
    "crates/progress-lambda",
    "crates/dashboard-lambda",
    "crates/sync-job",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
lambda_http = "0.12"
lambda_runtime = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aws-config = { version = "1", features = ["rustls"] }
aws-sdk-dynamodb = { version = "1", features = ["rustls"] }
jsonwebtoken = "9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

# Shared crate
shared = { path = "crates/shared" }
